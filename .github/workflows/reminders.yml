name: Rappels matchs + flux RSS
on:
  schedule:
    - cron: "*/5 * * * *"  # toutes les 5 min : alertes buts live + rappels (la collecte RSS/flux est limitée en interne à ~1x/heure)
  workflow_dispatch: {}    # permet aussi de le lancer à la main pour tester
jobs:
  rappels:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # pour committer feed.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install web-push
      - run: node reminders.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Commit du flux RSS, de la page des actus et du récap si modifiés
        run: |
          git config user.name "LynxBot"
          git config user.email "lynxbot@users.noreply.github.com"
          git add feed.xml actus.html
          if [ -f index.html ]; then git add index.html; fi
          if ls backup-*.json >/dev/null 2>&1; then git add backup-*.json; fi
          git diff --cached --quiet || (git commit -m "Flux RSS + actus + récap mis à jour" && git push)